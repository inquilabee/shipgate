# ShipGate dogfood: apply formatters, then check the project suite (shipgate.yaml).
# djlint is outside the catalog (Jinja templates only).
repos:
  - repo: local
    hooks:
      - id: djlint-reformat-templates
        name: djlint reformat Jinja templates
        entry: uv run djlint --reformat
        language: system
        files: ^src/shipgate/frontend/templates/.*\.html$
  - repo: local
    hooks:
      - id: shipgate-sync
        name: uv sync dev dependencies
        entry: uv sync --group dev
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-install
        name: shipgate install
        entry: uv run shipgate install
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-format
        name: shipgate format
        entry: uv run shipgate format --target .
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-check
        name: shipgate check
        entry: env PYTHONPATH=src uv run shipgate check --target .
        language: system
        pass_filenames: false
        always_run: true
      - id: refactor-check
        name: refactor check --strict
        entry: scripts/refactor-precommit.sh
        language: system
        files: ^(src|tests/refactor)/.*\.py$
        pass_filenames: true
      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
