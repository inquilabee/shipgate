# ShipGate dogfood: apply formatters, then check the full bundled suite.
# djlint is outside the catalog (Jinja templates only).
repos:
  - repo: local
    hooks:
      - id: djlint-reformat-templates
        name: djlint reformat Jinja templates
        entry: uv run djlint --reformat
        language: system
        files: ^src/shipgate/frontend/templates/.*\.html$

  - repo: local
    hooks:
      - id: shipgate-sync
        name: uv sync dev dependencies
        entry: uv sync --group dev
        language: system
        pass_filenames: false
        always_run: true

      - id: shipgate-install
        name: shipgate install (full suite)
        entry: uv run shipgate install --suite full
        language: system
        pass_filenames: false
        always_run: true

      - id: shipgate-apply-ruff-format
        name: shipgate apply — ruff format
        entry: uv run shipgate format --target .
        language: system
        pass_filenames: false
        always_run: true

      - id: shipgate-apply-mdformat
        name: shipgate apply — mdformat
        entry: uv run shipgate format --check mdformat.apply --target .
        language: system
        pass_filenames: false
        always_run: true

      - id: shipgate-apply-shfmt
        name: shipgate apply — shfmt
        entry: uv run shipgate format --check shfmt.apply --target .
        language: system
        pass_filenames: false
        always_run: true

      - id: shipgate-check
        name: shipgate check — full suite
        entry: bash -c 'for t in src tests docs; do uv run shipgate check --suite full --target "$t" || exit 1; done'
        language: system
        pass_filenames: false
        always_run: true
