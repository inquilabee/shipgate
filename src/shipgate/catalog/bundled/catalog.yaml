tools:
  ruff.lint:
    executable: ruff
    subcommand: ["check"]
    modes: ["check"]
    capabilities: ["Linting", "Quality"]
    normalizer: ruff
    install:
      manager: python
      package: ruff
      version: ">=0.6"
    cli:
      paths:
        style: positional
      config:
        flag: --config
        style: repeated
      exclude:
        flag: --exclude
        style: repeated
      output:
        flag: --output-file
        style: scalar
      format:
        flag: --output-format
        style: scalar
    configuration:
      bundled: configs/ruff.toml
      discover: [".shipgate/configs/ruff.toml", ".ruff.toml", "ruff.toml", "pyproject.toml"]
      pyproject_section: tool.ruff
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, exclude, format, output, paths]
    scope:
      extensions: [.py, .pyi, .ipynb]
      delivery: root

  ruff.format:
    executable: ruff
    subcommand: ["format"]
    modes: ["apply", "check"]
    capabilities: ["Formatting"]
    normalizer: generic_exit
    install:
      manager: python
      package: ruff
      version: ">=0.6"
    cli:
      paths:
        style: positional
      config:
        flag: --config
        style: repeated
      check:
        flag: --check
        style: boolean
    configuration:
      bundled: configs/ruff.toml
      discover: [".shipgate/configs/ruff.toml", ".ruff.toml", "ruff.toml", "pyproject.toml"]
      pyproject_section: tool.ruff
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, check, paths]
    scope:
      extensions: [.py, .pyi, .ipynb]
      delivery: root

  ty.check:
    executable: ty
    subcommand: ["check"]
    modes: ["check"]
    capabilities: ["TypeChecking"]
    normalizer: ty
    install:
      manager: python
      package: ty
      version: ">=0.0.1"
    cli:
      paths:
        style: positional
      format:
        flag: --output-format
        style: scalar
        default: gitlab
    configuration:
      bundled: configs/ty.toml
      discover: [".shipgate/configs/ty.toml", "ty.toml", "pyproject.toml"]
      pyproject_section: tool.ty
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [format, paths]
    scope:
      extensions: [.py, .pyi]
      delivery: root

  bandit.scan:
    executable: bandit
    subcommand: ["-r", "-ll", "-q"]
    modes: ["check"]
    capabilities: ["Security"]
    normalizer: bandit
    install:
      manager: python
      package: bandit
      version: ">=1.7"
    cli:
      paths:
        style: positional
      config:
        flag: -c
        style: scalar
      format:
        flag: -f
        style: scalar
      output:
        flag: -o
        style: scalar
    configuration:
      bundled: configs/bandit.yaml
      discover: [".shipgate/configs/bandit.yaml", ".bandit", "bandit.yaml", "pyproject.toml"]
      pyproject_section: tool.bandit
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, format, output, paths]
    scope:
      extensions: [.py]
      delivery: root

  codespell.check:
    executable: codespell
    subcommand: []
    modes: ["check"]
    capabilities: ["Spelling"]
    normalizer: codespell
    install:
      manager: python
      package: codespell
      version: ">=2.2"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.md, .rst, .txt]
      delivery: files

  gitleaks.scan:
    executable: gitleaks
    subcommand: ["detect", "--no-banner"]
    modes: ["check"]
    capabilities: ["Security", "Secrets"]
    normalizer: gitleaks
    install:
      manager: binary
      package: gitleaks
      version: ">=8.0"
      binary: gitleaks
    cli:
      paths:
        flag: --source
        style: scalar
        aggregate: root
      config:
        flag: --config
        style: scalar
    configuration:
      bundled: configs/gitleaks.toml
      discover: [".shipgate/configs/gitleaks.toml", ".gitleaks.toml", "gitleaks.toml"]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, paths]
    scope:
      delivery: root

  semgrep.scan:
    executable: semgrep
    subcommand:
      - scan
      - --json
      - --config
      - p/python
      - --config
      - p/security-audit
      - --config
      - p/secrets
    modes: ["check"]
    capabilities: ["Security", "Quality"]
    normalizer: semgrep
    install:
      manager: python
      package: semgrep
      version: ">=1.0"
    cli:
      paths:
        style: positional
      config:
        flag: --config
        style: repeated
      exclude:
        flag: --exclude
        style: repeated
    configuration:
      bundled: configs/semgrep.yaml
      discover:
        [
          ".shipgate/configs/semgrep.yaml",
          ".semgrep.yml",
          ".semgrep.yaml",
          "semgrep.yaml",
          "semgrep.yml",
        ]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, exclude, paths]
    scope:
      delivery: root

  deadcode.check:
    executable: deadcode
    subcommand: []
    modes: ["check"]
    capabilities: ["Quality"]
    normalizer: generic_exit
    install:
      manager: python
      package: deadcode
      version: ">=1.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: root

  vulture.check:
    executable: vulture
    subcommand: ["--min-confidence", "80"]
    modes: ["check"]
    capabilities: ["Quality"]
    normalizer: vulture
    install:
      manager: python
      package: vulture
      version: ">=2.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: dirs

  radon.cc:
    executable: radon
    subcommand: ["cc", "-j"]
    modes: ["check"]
    capabilities: ["Metrics"]
    normalizer: radon
    install:
      manager: python
      package: radon
      version: ">=6.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: root

  radon.mi:
    executable: radon
    subcommand: ["mi", "-j"]
    modes: ["check"]
    capabilities: ["Metrics"]
    normalizer: radon
    install:
      manager: python
      package: radon
      version: ">=6.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: root

  pytest.run:
    executable: pytest
    subcommand: []
    modes: ["check"]
    capabilities: ["Testing"]
    normalizer: pytest
    install:
      manager: python
      package: pytest
      version: ">=8.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      delivery: root

  pydeps.graph:
    executable: pydeps
    subcommand: []
    modes: ["check"]
    capabilities: ["Dependencies"]
    normalizer: generic_exit
    install:
      manager: python
      package: pydeps
      version: ">=1.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: root

  markdownlint.check:
    executable: markdownlint
    subcommand: []
    modes: ["check"]
    capabilities: ["Documentation"]
    normalizer: markdownlint
    install:
      manager: binary
      package: markdownlint-cli
      version: ">=0.37"
      binary: markdownlint
    cli:
      paths:
        style: positional
      config:
        flag: --config
        style: scalar
    configuration:
      bundled: configs/markdownlint.json
      discover:
        [
          ".shipgate/configs/markdownlint.json",
          ".markdownlint.json",
          ".markdownlint.yaml",
          ".markdownlint.yml",
        ]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, paths]
    scope:
      extensions: [.md]
      globs: ['**/*.mdc']
      delivery: files

  mdformat.apply:
    executable: mdformat
    subcommand: []
    modes: ["apply", "check"]
    capabilities: ["Documentation", "Formatting"]
    normalizer: generic_exit
    install:
      manager: python
      package: mdformat
      version: ">=0.7"
    cli:
      paths:
        style: positional
      check:
        flag: --check
        style: boolean
    option_order: [check, paths]
    scope:
      extensions: [.md]
      globs: ['**/*.mdc']
      delivery: files

  yamllint.check:
    executable: yamllint
    subcommand: []
    modes: ["check"]
    capabilities: ["Quality"]
    normalizer: generic_exit
    install:
      manager: python
      package: yamllint
      version: ">=1.30"
    cli:
      paths:
        style: positional
      config:
        flag: --config-file
        style: scalar
    configuration:
      bundled: configs/yamllint.yaml
      discover:
        [
          ".shipgate/configs/yamllint.yaml",
          ".yamllint",
          ".yamllint.yaml",
          ".yamllint.yml",
          "yamllint.yaml",
          "yamllint.yml",
        ]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, paths]
    scope:
      extensions: [.yaml, .yml]
      delivery: files

  yamlfmt.apply:
    executable: yamlfmt
    subcommand: []
    modes: ["apply", "check"]
    capabilities: ["Formatting"]
    normalizer: generic_exit
    install:
      manager: binary
      package: yamlfmt
      version: ">=0.0.1"
      binary: yamlfmt
    cli:
      paths:
        style: positional
      config:
        flag: -conf
        style: scalar
    configuration:
      bundled: configs/yamlfmt.yaml
      discover: [".shipgate/configs/yamlfmt.yaml", ".yamlfmt", "yamlfmt.yaml"]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, paths]
    scope:
      extensions: [.yaml, .yml]
      delivery: files

  shellcheck.check:
    executable: shellcheck
    subcommand: []
    modes: ["check"]
    capabilities: ["Shell"]
    normalizer: generic_exit
    install:
      manager: binary
      package: shellcheck
      version: ">=0.9"
      binary: shellcheck
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.sh, .bash]
      delivery: files

  shfmt.apply:
    executable: shfmt
    subcommand: []
    modes: ["apply", "check"]
    capabilities: ["Shell", "Formatting"]
    normalizer: generic_exit
    install:
      manager: binary
      package: shfmt
      version: ">=3.0"
      binary: shfmt
    cli:
      paths:
        style: positional
      check:
        flag: -d
        style: boolean
    option_order: [check, paths]
    scope:
      extensions: [.sh, .bash]
      delivery: files

  hadolint.check:
    executable: hadolint
    subcommand: []
    modes: ["check"]
    capabilities: ["Docker"]
    normalizer: generic_exit
    install:
      manager: binary
      package: hadolint
      version: ">=2.0"
      binary: hadolint
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      globs: ['**/Dockerfile*', '**/*.dockerfile']
      delivery: files

  jscpd.check:
    executable: jscpd
    subcommand: []
    modes: ["check"]
    capabilities: ["Quality"]
    normalizer: generic_exit
    install:
      manager: binary
      package: jscpd
      version: ">=3.0"
      binary: jscpd
    cli:
      paths:
        style: positional
      config:
        flag: --config
        style: scalar
      threshold:
        flag: --threshold
        style: scalar
        default: "2"
    configuration:
      bundled: configs/jscpd.json
      discover: [".shipgate/configs/jscpd.json", ".jscpd.json", "jscpd.json"]
      precedence: [cli, repo, bundled]
      merge: false
    option_order: [config, threshold, paths]
    scope:
      delivery: root

  mutmut.run:
    executable: mutmut
    subcommand: ["run"]
    modes: ["check"]
    capabilities: ["Testing"]
    normalizer: generic_exit
    install:
      manager: python
      package: mutmut
      version: ">=2.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      delivery: root

  sourcery.review:
    executable: sourcery
    subcommand: ["review"]
    modes: ["check"]
    capabilities: ["Quality"]
    normalizer: generic_exit
    install:
      manager: python
      package: sourcery
      version: ">=1.0"
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      extensions: [.py]
      delivery: root

  gate.script:
    executable: python
    subcommand: []
    modes: ["check", "apply"]
    capabilities: ["Gates"]
    normalizer: generic_exit
    cli:
      paths:
        style: positional
    option_order: [paths]
    scope:
      delivery: root

  gate.module-size:
    executable: bash
    script: gates/module-size.sh
    modes: ["check"]
    capabilities: ["Gates", "Policy"]
    normalizer: gate_json
    configuration:
      bundled: configs/gates/module-size.yaml
      discover: [".shipgate/configs/gates/gate.module-size.yaml"]
      precedence: [repo, bundled]
    option_order: []
    scope:
      extensions: [.py]
      delivery: files

  gate.module-private-vars:
    executable: bash
    script: gates/module-private-vars.sh
    modes: ["check"]
    capabilities: ["Gates", "Policy"]
    normalizer: gate_json
    configuration:
      bundled: configs/gates/module-private-vars.yaml
      discover: [".shipgate/configs/gates/gate.module-private-vars.yaml"]
      precedence: [repo, bundled]
    option_order: []
    scope:
      extensions: [.py]
      delivery: files

  gate.folder-breadth:
    executable: bash
    script: gates/folder-breadth.sh
    modes: ["check"]
    capabilities: ["Gates", "Policy"]
    normalizer: gate_json
    configuration:
      bundled: configs/gates/folder-breadth.yaml
      discover: [".shipgate/configs/gates/gate.folder-breadth.yaml"]
      precedence: [repo, bundled]
    option_order: []
    scope:
      extensions: [.py, .md, .yaml, .sh]
      delivery: dirs

  gate.acronym-allowlist:
    executable: bash
    script: gates/acronym-allowlist.sh
    modes: ["check"]
    capabilities: ["Gates", "Policy"]
    normalizer: gate_json
    configuration:
      bundled: configs/gates/acronym-allowlist.yaml
      discover: [".shipgate/configs/gates/gate.acronym-allowlist.yaml"]
      precedence: [repo, bundled]
    option_order: []
    scope:
      extensions: [.md]
      globs: ['**/*.mdc']
      delivery: files

suites:
  python-quality:
    members: [ruff.lint, ty.check]
    parallel: false
    fail_fast: false

  format:
    members: [ruff.format, mdformat.apply, shfmt.apply, yamlfmt.apply]
    parallel: false
    fail_fast: true

  security:
    members: [bandit.scan, gitleaks.scan, semgrep.scan]
    parallel: false
    fail_fast: false

  extended:
    members:
      - ty.check
      - codespell.check
      - deadcode.check
      - vulture.check
      - radon.cc
      - radon.mi
      - jscpd.check
      - markdownlint.check
      - yamllint.check
    parallel: false
    fail_fast: false

  standard:
    members: [python-quality]
    parallel: false
    fail_fast: false

  full:
    members: [standard, security, extended, policy]
    parallel: false
    fail_fast: false

  docs:
    members: [markdownlint.check, mdformat.apply, yamllint.check]
    parallel: false
    fail_fast: false

  shell:
    members: [shellcheck.check, shfmt.apply]
    parallel: false
    fail_fast: false

  policy:
    members:
      - gate.module-size
      - gate.module-private-vars
      - gate.folder-breadth
      - gate.acronym-allowlist
    parallel: false
    fail_fast: true

  docker:
    members: [hadolint.check]
    parallel: false
    fail_fast: false

  ci:
    members: [standard, security, policy]
    parallel: false
    fail_fast: true

  nightly:
    members: [full, mutmut.run]
    parallel: false
    fail_fast: false

  release:
    members: [full]
    parallel: false
    fail_fast: true

  pre-commit:
    members: [format, python-quality]
    parallel: false
    fail_fast: true

workflows:
  default:
    - check: [standard]
  ci:
    - check: [ci]
  quality:
    - check: [python-quality]
  release:
    - check: [release]
  pre-commit:
    - apply: [format]
    - check: [python-quality]
  nightly:
    - check: [nightly]

capabilities:
  Linting: [ruff.lint]
  Formatting: [ruff.format, mdformat.apply, shfmt.apply, yamlfmt.apply]
  TypeChecking: [ty.check]
  Security: [bandit.scan, gitleaks.scan, semgrep.scan]
  Policy:
    - gate.module-size
    - gate.module-private-vars
    - gate.folder-breadth
    - gate.acronym-allowlist
  Gates:
    - gate.module-size
    - gate.module-private-vars
    - gate.folder-breadth
    - gate.acronym-allowlist
