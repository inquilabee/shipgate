# ShipGate starter import contracts (copied by `shipgate init` / `configs sync`).
# Replace optional layer names with your real package layout, or switch to
# forbidden / independence contracts. root_package must be importable
# (src-layout: PYTHONPATH=src, or install the package editable).
#
# __ROOT_PACKAGE__ is substituted at scaffold time from the project package name.

[importlinter]
root_package = __ROOT_PACKAGE__

[importlinter:contract:starter-layers]
name = Starter layers (optional until modules exist — edit to match your architecture)
type = layers
# Layer names are relative to containers (import-linter semantics).
layers =
    (api)
    (domain)
    (data)
containers =
    __ROOT_PACKAGE__
