suite: full
env: managed
target: .
changed-only: true
error-format: compact
configs:
  mode: auto
checks:
  semgrep.scan:
    scope: semgrep
  radon.cc:
    # Letter rank is per-block. Median / p95 gate typical and tail complexity.
    threshold: B
    median-mode: threshold
    median-threshold: 3
    p95-mode: threshold
    p95-threshold: 7
  radon.mi:
    # Letter rank is per-file. Median / p95 gate typical and high-end MI.
    threshold: B
    median-mode: threshold
    median-threshold: 55.5
    p95-mode: threshold
    p95-threshold: 100
  jscpd.check.python:
    threshold: "2"
  jscpd.check.other:
    threshold: "5"
scopes:
  semgrep:
    target: .
allowlists:
  gate.acronym-allowlist: .shipgate/allowlists/acronyms.yaml
  gate.folder-breadth: .shipgate/allowlists/folder-breadth.yaml
  gate.module-size: .shipgate/allowlists/module-size.yaml
  gate.module-private-vars: .shipgate/allowlists/module-private-vars.yaml
  gate.test-only-symbols: .shipgate/allowlists/test-only-symbols.yaml
  gate.repeated-strings: .shipgate/allowlists/repeated-strings.yaml
  gate.class-local-functions: .shipgate/allowlists/class-local-functions.yaml
