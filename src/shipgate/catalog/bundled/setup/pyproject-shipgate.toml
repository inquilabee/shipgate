[tool.shipgate]
suite = "full"
env = "managed"
target = "."
changed_only = true
error_format = "compact"

[tool.shipgate.configs]
mode = "auto"

[tool.shipgate.checks."semgrep.scan"]
scope = "semgrep"

[tool.shipgate.checks."radon.cc"]
# Letter rank is per-block. Median / p95 gate typical and tail complexity.
threshold = "B"
median_mode = "threshold"
median_threshold = 3
p95_mode = "threshold"
p95_threshold = 7

[tool.shipgate.checks."radon.mi"]
# Letter rank is per-file. Distribution floors are progressive (portable init);
# pin absolute median/p5/p10 via calibrate when ready.
threshold = "B"
median_mode = "progressive"
p5_mode = "progressive"
p10_mode = "progressive"
minimum_mode = "progressive"

[tool.shipgate.checks."jscpd.check.python"]
threshold = "2"

[tool.shipgate.checks."jscpd.check.other"]
threshold = "5"

[tool.shipgate.scopes.semgrep]
target = "."

[tool.shipgate.allowlists]
"gate.acronym-allowlist" = ".shipgate/allowlists/acronyms.yaml"
"gate.folder-breadth" = ".shipgate/allowlists/folder-breadth.yaml"
"gate.module-size" = ".shipgate/allowlists/module-size.yaml"
"gate.module-private-vars" = ".shipgate/allowlists/module-private-vars.yaml"
"gate.test-only-symbols" = ".shipgate/allowlists/test-only-symbols.yaml"
"gate.repeated-strings" = ".shipgate/allowlists/repeated-strings.yaml"
"gate.class-local-functions" = ".shipgate/allowlists/class-local-functions.yaml"
"gate.staticmethod-soup" = ".shipgate/allowlists/staticmethod-soup.yaml"
