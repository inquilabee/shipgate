sourcery.review:
  executable: sourcery
  subcommand:
    - review
  modes:
    - check
  normalizer: generic_exit
  install:
    manager: python
    package: sourcery
    version: ">=1.0"
  cli:
    paths:
      style: positional
  option_order:
    - paths
  scope:
    extensions:
      - .py
    delivery: root
