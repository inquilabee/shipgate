mdformat.apply:
  executable: mdformat
  subcommand: []
  modes:
    - apply
    - check
  capabilities:
    - Documentation
    - Formatting
  normalizer: generic_exit
  install:
    manager: python
    package: mdformat
    version: '>=0.7'
    requires:
      - mdformat-frontmatter>=2.0
  cli:
    paths:
      style: positional
    check:
      flag: --check
      style: boolean
  configuration:
    bundled: configs/mdformat.toml
    discover:
      - .mdformat.toml
    precedence:
      - repo
      - bundled
    merge: false
  option_order:
    - check
    - paths
  scope:
    extensions:
      - .md
    globs:
      - '**/*.mdc'
    delivery: files
