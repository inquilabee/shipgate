deadcode.check:
  executable: deadcode
  subcommand: []
  modes:
    - check
  capabilities:
    - Quality
  normalizer: generic_exit
  install:
    manager: python
    package: deadcode
    version: '>=1.0'
  cli:
    paths:
      style: positional
  option_order:
    - paths
  scope:
    extensions:
      - .py
    delivery: root
