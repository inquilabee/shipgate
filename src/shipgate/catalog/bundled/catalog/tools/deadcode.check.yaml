deadcode.check:
  executable: deadcode
  subcommand: []
  modes:
    - check
  capabilities:
    - Quality
  normalizer: generic_exit
  install:
    manager: python
    package: deadcode
    version: ">=1.0"
  cli:
    paths:
      style: positional
    exclude:
      flag: --exclude
      style: repeated
  option_order:
    - paths
    - exclude
  scope:
    extensions:
      - .py
    delivery: dirs
