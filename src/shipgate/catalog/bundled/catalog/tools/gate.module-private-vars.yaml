gate.module-private-vars:
  executable: bash
  script: gates/module-private-vars.sh
  modes:
    - check
  normalizer: gate_json
  configuration:
    bundled: configs/gates/module-private-vars.yaml
    discover:
      - .shipgate/configs/gates/gate.module-private-vars.yaml
    precedence:
      - repo
      - bundled
  option_order: []
  scope:
    extensions:
      - .py
    delivery: files
