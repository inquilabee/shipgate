vulture.check:
  executable: vulture
  subcommand:
    - --min-confidence
    - "80"
  modes:
    - check
  capabilities:
    - Quality
  normalizer: vulture
  install:
    manager: python
    package: vulture
    version: ">=2.0"
  cli:
    paths:
      style: positional
  option_order:
    - paths
  scope:
    extensions:
      - .py
    delivery: dirs
