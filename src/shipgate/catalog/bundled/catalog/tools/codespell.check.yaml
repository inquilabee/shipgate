codespell.check:
  executable: codespell
  subcommand: []
  modes:
    - check
  capabilities:
    - Spelling
  normalizer: codespell
  install:
    manager: python
    package: codespell
    version: '>=2.2'
  cli:
    paths:
      style: positional
  option_order:
    - paths
  scope:
    extensions:
      - .md
      - .rst
      - .txt
    delivery: files
