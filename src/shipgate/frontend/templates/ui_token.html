{% extends "base.html" %}
{% block title %}Unlock · shipgate{% endblock %}
{% block content %}
    <div class="mx-auto max-w-xl space-y-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Unlock this browser</h1>
            <p class="mt-1 text-sm text-muted">
                Enter <code>SHIPGATE_UI_TOKEN</code>. It is stored in an HttpOnly cookie and is never written into the page.
            </p>
        </div>
        {% if error %}
            <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-800">{{ error }}</div>
        {% endif %}
        <form class="space-y-4 rounded-xl border border-line bg-surface p-5"
              method="post"
              action="/ui-token">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="mb-1 block text-sm font-semibold" for="token">UI token</label>
                <input id="token"
                       type="password"
                       name="token"
                       required
                       autocomplete="off"
                       class="w-full rounded-lg border border-line bg-white px-3 py-2 text-sm">
            </div>
            <button type="submit"
                    class="inline-flex rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white hover:bg-brand-dark">
                Unlock
            </button>
        </form>
    </div>
{% endblock %}
