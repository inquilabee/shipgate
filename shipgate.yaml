suite: full
env: system
target: .
error-format: compact
configs:
  mode: auto
checks:
  semgrep.scan:
    scope: semgrep
  radon.cc:
    threshold: B
  radon.mi:
    threshold: B
  jscpd.check:
    threshold: "4"
scopes:
  semgrep:
    target: .
    exclude:
      - src/shipgate/frontend/templates/
