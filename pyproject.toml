[project]
name = "shipgate"
version = "0.1.0"
description = "Portable quality-gate orchestrator for developer tools"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PyYAML>=6.0",
  "pathspec>=0.12",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
shipgate = "shipgate.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "djlint>=1.40",
  "pytest>=8.0",
  "ruff>=0.6",
  "ty>=0.0.1",
  "bandit>=1.7",
  "codespell>=2.2",
  "deadcode>=1.0",
  "mdformat>=0.7",
  "radon>=6.0",
  "semgrep>=1.0",
  "setuptools>=68,<81",
  "vulture>=2.0",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipgate = ["catalog/bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external tools",
]

[tool.djlint]
profile = "jinja"
