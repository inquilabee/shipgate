[project]
name = "shipgate"
version = "0.1.0"
description = "Portable quality-gate orchestrator for developer tools"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PyYAML>=6.0",
  "pathspec>=0.12",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
shipgate = "shipgate.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "djlint>=1.40",
  "pytest>=8.0",
  "ruff>=0.6",
  "ty>=0.0.1",
  "mdformat>=0.7",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipgate = ["catalog/bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external tools",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "TCH", "ASYNC", "S", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/shipgate/runtime/executor.py" = ["S603"]
"src/shipgate/runtime/install.py" = ["S603"]
"src/shipgate/planning/gitignore.py" = ["S603", "S607"]
"src/shipgate/frontend/services/worktree.py" = ["S603", "S607"]
"src/shipgate/frontend/services/tool_versions.py" = ["S603"]
"src/shipgate/frontend/storage/sqlite.py" = ["S608"]

[tool.djlint]
profile = "jinja"
