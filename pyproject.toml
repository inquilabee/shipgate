[project]
name = "shipgate"
version = "0.1.5"
description = "Portable quality-gate orchestrator for developer tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vishal Kumar Mishra", email = "vishal.k.mishra2@gmail.com" },
]
keywords = [
  "shipgate",
  "quality",
  "lint",
  "format",
  "pre-commit",
  "python",
  "static-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "libcst>=1.4",
    "pathspec>=0.12",
    "typer>=0.27.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.urls]
Changelog = "https://github.com/inquilabee/shipgate/blob/main/CHANGELOG.md"
Homepage = "https://github.com/inquilabee/shipgate"
Issues = "https://github.com/inquilabee/shipgate/issues"
Repository = "https://github.com/inquilabee/shipgate"

[project.scripts]
shipgate = "shipgate.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "djlint>=1.40",
  "pytest>=8.0",
  "ruff>=0.6",
  "ty>=0.0.1",
  "bandit>=1.7",
  "codespell>=2.2",
  "deadcode>=1.0",
  "mdformat>=0.7",
  "mdformat-frontmatter>=2.0",
  "radon>=6.0",
  "semgrep>=1.0",
  "setuptools>=68,<81",
  "vulture>=2.0",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pytest-playwright>=0.6",
]

# FastAPI server extras are required at runtime for templates/forms but are not
# imported by name (Jinja2Templates / multipart parsing), so DEP002 ignores them.
[tool.deptry]
known_first_party = ["refactor", "shipgate"]

[tool.deptry.per_rule_ignores]
DEP002 = ["jinja2", "python-multipart"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipgate = [
  "catalog/bundled/**/*",
  "catalog/bundled/setup/.gitignore",
  "gates/templates/**/*",
]
refactor = [
  "inventory/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: tests that require external tools",
  "ui: browser UI tests (Playwright; requires chromium)",
]
addopts = "-m 'not ui'"

[tool.djlint]
profile = "jinja"
