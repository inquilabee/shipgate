# ShipGate dogfood import contracts (managed env prepends PYTHONPATH=src).

[importlinter]
root_package = shipgate

[importlinter:contract:domain-isolation]
name = Domain must not import orchestration layers
type = forbidden
source_modules =
    shipgate.domain
forbidden_modules =
    shipgate.adapter
    shipgate.app
    shipgate.cli
    shipgate.frontend
    shipgate.normalize
    shipgate.planning
    shipgate.runtime

[importlinter:contract:core-isolation]
name = Core must not import orchestration layers
type = forbidden
source_modules =
    shipgate.core
forbidden_modules =
    shipgate.adapter
    shipgate.app
    shipgate.cli
    shipgate.frontend
    shipgate.normalize
    shipgate.planning
    shipgate.runtime
    shipgate.catalog
    shipgate.config
