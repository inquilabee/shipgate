# Documented acronyms used in ShipGate prose (keys are allowlisted tokens).
UI: user interface
UX: user experience
JSCPD: copy-paste detector tool
SARIF: Static Analysis Results Interchange Format
PR: pull request
AI: artificial intelligence
MIT: Massachusetts Institute of Technology (software license short name)
LICENSE: repository license filename
CONTRIBUTING: contributing guide filename
CVE: Common Vulnerabilities and Exposures
PYTHONPATH: Python module search path environment variable
MI: maintainability index (Radon)
CC: cyclomatic complexity (Radon)
GPSG: Google Python Style Guide (Sourcery optional rule pack)
ICN: Ruff flake8-import-conventions rule family
MVP: minimum viable product
ANN: Ruff flake8-annotations rule family
OR: logical disjunction in enable-token matching
