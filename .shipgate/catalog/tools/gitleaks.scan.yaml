gitleaks.scan:
  executable: gitleaks
  subcommand:
    - detect
    - --no-banner
  modes:
    - check
  normalizer: gitleaks
  install:
    manager: binary
    package: gitleaks
    version: '>=8.0'
    binary: gitleaks
  cli:
    paths:
      flag: --source
      style: scalar
      aggregate: root
    config:
      flag: --config
      style: scalar
  configuration:
    bundled: configs/gitleaks.toml
    discover:
      - .shipgate/configs/gitleaks.toml
      - .gitleaks.toml
      - gitleaks.toml
    precedence:
      - cli
      - repo
      - bundled
    merge: false
  option_order:
    - config
    - paths
  scope:
    delivery: root
